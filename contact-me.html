    <style>
      textarea {
        /* Dimensions & Resizing */
        width: 100%;
        height: 150px;
        min-height: 80px;
        resize: vertical; /* Allows resizing up & down, but prevents breaking layout width */
        box-sizing: border-box; /* Ensures padding & borders don't exceed the width */

        /* Typography (Browsers don't inherit font-family by default) */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #333333;

        /* Box Styling */
        background-color: #fcfcfc;
        padding: 12px 16px;
        border: 1px solid #cccccc;
        border-radius: 6px;

        /* Smooth Transitions for Interaction states */
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      }
      /* 2. Style Interaction States */

      /* Hover state */
      textarea:hover {
        border-color: #a0a0a0;
        background-color: #ffffff;
      }

      /* Focus state (When the user clicks into it) */
      textarea:focus {
        outline: none; /* Removes the ugly default browser outline */
        border-color: #0066cc; /* Clean modern accent color */
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15); /* Soft outer glow */
        background-color: #ffffff;
      }

      /* 3. Optional: Style the Placeholder text */
      textarea::placeholder {
        color: #888888;
        font-style: italic;
      }
      
      input {
        box-sizing: border-box;
      }

      /* Target specific text-based input fields */
      input[type="text"], 
      input[type="email"], 
      input[type="password"] {
        width: 100%;             /* Make it responsive */
        max-width: 400px;        /* Restrict maximum width */
        padding: 12px 16px;      /* Generous touch targets for mobile */
        font-size: 16px;         /* Prevents iOS from auto-zooming on focus */

        /* Borders and Edges */
        border: 2px solid #ccc;
        border-radius: 6px;      /* Smooth rounded corners */
        background-color: #fff;
        color: #333;

        /* Smooth animation transition when clicking into the field */
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
      
      .submit-buttonprimary {
        background-color: black;    /* Sets background to black */
        color: white;               /* Sets text color to white */
        border-radius: 8px;         /* Rounds the corners */
        border: none;               /* Removes the default browser border */
        padding: 10px 20px;         /* Adds vertical and horizontal spacing */
        font-size: 16px;            /* Enhances text readability */
        cursor: pointer;            /* Changes cursor to a hand on hover */
      }

    <script>
      // This script handles sending an email notification when someone submits the form
      // Paste your Google Web App URL here
      const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwR-gsamnrjQyVSO675G7p0Q56FsarPmiwncPixDh4HPz1R4_so6EYWWt4RFrKcO2HC/exec';

      const form = document.getElementById('contactForm');
      const submitBtn = document.getElementById('submitBtn');
      const statusText = document.getElementById('status');

      form.addEventListener('submit', async (e) => {
        e.preventDefault(); // Stop page reload

        // 1. Check the honeypot field
        const honeypotValue = document.getElementById('honeypot').value;
        if (honeypotValue.trim() !== "") {
          console.log("Bot detected!");
          // Trick the bot into thinking it succeeded without sending anything
          statusText.style.color = 'green';
          statusText.textContent = 'Thank you! Your message has been sent.';
          form.reset();
          return; // Stop the function here
        }

        // 2. Your normal code continues below if it's a human...
        // 
        // Update UI state
        submitBtn.disabled = true;
        statusText.style.color = 'black';
        statusText.textContent = 'Sending message...';

        // Gather form inputs
        const formData = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          message: document.getElementById('message').value
        };

        try {
          // Send data to Google Apps Script
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Necessary for dealing with Google cross-domain requests
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
          });

          // Note: Because of 'no-cors', response.ok will not return true.
          // We assume it sent successfully if no catch block error triggers.
          statusText.style.color = 'green';
          statusText.textContent = 'Thank you! Your message has been sent.';
          form.reset();

        } catch (error) {
          console.error('Error:', error);
          statusText.style.color = 'red';
          statusText.textContent = 'An error occurred. Please try again later.';
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
