      textarea {
        /* Dimensions & Resizing */
        width: 100%;
        height: 150px;
        min-height: 80px;
        resize: vertical; /* Allows resizing up & down, but prevents breaking layout width */
        box-sizing: border-box; /* Ensures padding & borders don't exceed the width */

        /* Typography (Browsers don't inherit font-family by default) */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #333333;

        /* Box Styling */
        background-color: #fcfcfc;
        padding: 12px 16px;
        border: 1px solid #cccccc;
        border-radius: 6px;

        /* Smooth Transitions for Interaction states */
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      }
      /* 2. Style Interaction States */

      /* Hover state */
      textarea:hover {
        border-color: #a0a0a0;
        background-color: #ffffff;
      }

      /* Focus state (When the user clicks into it) */
      textarea:focus {
        outline: none; /* Removes the ugly default browser outline */
        border-color: #0066cc; /* Clean modern accent color */
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15); /* Soft outer glow */
        background-color: #ffffff;
      }

      /* 3. Optional: Style the Placeholder text */
      textarea::placeholder {
        color: #888888;
        font-style: italic;
      }
      
      input {
        box-sizing: border-box;
      }

      /* Target specific text-based input fields */
      input[type="text"], 
      input[type="email"], 
      input[type="password"] {
        width: 100%;             /* Make it responsive */
        max-width: 400px;        /* Restrict maximum width */
        padding: 12px 16px;      /* Generous touch targets for mobile */
        font-size: 16px;         /* Prevents iOS from auto-zooming on focus */

        /* Borders and Edges */
        border: 2px solid #ccc;
        border-radius: 6px;      /* Smooth rounded corners */
        background-color: #fff;
        color: #333;

        /* Smooth animation transition when clicking into the field */
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        background-color: black;    /* Sets background to black */

     <script>
    // Paste your Google Web App URL here
    const WEB_APP_URL = 'YOUR_WEB_APP_URL_HERE';

    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusText = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // Stop page reload

      // Update UI state
      submitBtn.disabled = true;
      statusText.style.color = 'black';
      statusText.textContent = 'Sending message...';

      // Gather form inputs
      const formData = {
        name: document.getElementById('firstName').value + document.getElementById(' lastNmae'),
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        // Send data to Google Apps Script
        const response = await fetch(https://script.google.com/macros/s/AKfycby5iikIXdu5V549t7VB7cv4Gvz3PlQ059Lr0ObvW2QrTByPaYkxuOYtF5vP7ilKC9FR/exec, {
          method: 'POST',
          mode: 'no-cors', // Necessary for dealing with Google cross-domain requests
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        // Note: Because of 'no-cors', response.ok will not return true.
        // We assume it sent successfully if no catch block error triggers.
        statusText.style.color = 'green';
        statusText.textContent = 'Thank you! Your message has been sent.';
        form.reset();

      } catch (error) {
        console.error('Error:', error);
        statusText.style.color = 'red';
        statusText.textContent = 'An error occurred. Please try again later.';
      } finally {
        submitBtn.disabled = false;
      }
    });

        var capturedModules = null;

          if (!raw) return null;
          var decoder = document.createElement('textarea');
          decoder.innerHTML = raw;
          try { return JSON.parse(decoder.value); } catch (e) { return null; }
        }
        function toPositiveInt(v, fallback) {
          var n = parseInt(v, 10);
          return (!isNaN(n) && n > 0) ? n : fallback;
        }
        function toSpacing(v, fallback) {
          // Zero is a legitimate gap, so it must not fall through to the default
          // the way toPositiveInt makes it.

          // slider's OWN base config instead of assuming a multi-card carousel.
          // Hardcoding 3-on-desktop here overrode every single-slide slider that
          // omits the map — the generator tells the model to omit it for hero
          // carousels, and the gallery lightbox omitted it too — which fits every
          // slide onto one page and leaves the arrows and bullets with nowhere to
          // go. Same derivation the editor uses in flows/slider.ts.
          var baseSlidesPerView = toPositiveInt(el.getAttribute('data-slides-per-view'), 1);
          var bps = {};
          bps[0] = {
            slidesPerView: toPositiveInt(mobile.slidesPerView, 1),
            spaceBetween: toSpacing(mobile.spaceBetween, 12),
          };
          bps[768] = {
            slidesPerView: toPositiveInt(tablet.slidesPerView, Math.min(baseSlidesPerView, 2)),
            spaceBetween: toSpacing(tablet.spaceBetween, 16),
          };

            spaceBetween: toSpacing(desktop.spaceBetween, 24),
