<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; width: 100%; }
    button:disabled { background-color: #cccccc; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
    /* Honey Pot field to trap spam bots */
    .hidden-field {
      display: none !important;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <h2>Contact Me</h2>
  <form id="contactForm">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" rows="5" required></textarea>
    </div>
    <div class="form-group hidden-field">
      <label for="honeypot">Leave this field blank</label>
      <input type="text" id="honeypot" autocomplete="off" tabindex="-1">
    </div>
    <button type="submit" id="submitBtn">Send Message</button>
  </form>

  <p id="status"></p>

  <script>
    // Paste your Google Web App URL here
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwR-gsamnrjQyVSO675G7p0Q56FsarPmiwncPixDh4HPz1R4_so6EYWWt4RFrKcO2HC/exec';

    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusText = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // Stop page reload

      // 1. Check the honeypot field
      const honeypotValue = document.getElementById('honeypot').value;
      if (honeypotValue.trim() !== "") {
        console.log("Bot detected!");
        // Trick the bot into thinking it succeeded without sending anything
        statusText.style.color = 'green';
        statusText.textContent = 'Thank you! Your message has been sent.';
        form.reset();
        return; // Stop the function here
      }

      // 2. Your normal code continues below if it's a human...
      // 
      // Update UI state
      submitBtn.disabled = true;
      statusText.style.color = 'black';
      statusText.textContent = 'Sending message...';

      // Gather form inputs
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        // Send data to Google Apps Script
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors', // Necessary for dealing with Google cross-domain requests
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        // Note: Because of 'no-cors', response.ok will not return true.
        // We assume it sent successfully if no catch block error triggers.
        statusText.style.color = 'green';
        statusText.textContent = 'Thank you! Your message has been sent.';
        form.reset();

      } catch (error) {
        console.error('Error:', error);
        statusText.style.color = 'red';
        statusText.textContent = 'An error occurred. Please try again later.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
